<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>String Manager</title>
</head>
<body>
    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: white !important;
        }
        h1 {
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;
        }
        h1:hover {
            opacity: 60%;
            cursor: pointer;
        }

        .pio:hover {
            opacity: 60%;
            cursor: pointer;
        }

        .mybutton {
            padding: 10px;
            margin: 0px;
            color: white;
            background-color: gray;
            border: none;
            outline: none;
            box-shadow: none;
            cursor: pointer;
        }

        .mybutton:hover {
            background-color: rgb(81, 78, 78);
        }

        h2:hover {
            opacity: 60%;
        }

        .thebutton:hover {
            box-shadow: 0 0 5px 5px rgb(242, 175, 219);  
            cursor: pointer;
        }

        .thebutton {
            transition: box-shadow 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            width: 150px;
        
        }

        .colorpicker:hover {
            box-shadow: 0 0 15px 15px rgb(242, 175, 175);  
            cursor: pointer;
        }

        .colorpicker {
            transition: box-shadow 0.3s ease;
        }


        .mylabel:hover {
            opacity: 60%;
            cursor: pointer;
        }

    </style>

    <header style="text-align: center; padding: 15px; background-color: lightblue;  border-bottom: 5px solid black;">
        <h1 style="margin-top: 20px; font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; margin-bottom: 20px;">String Manager</h1>
    </header>
    
    <br>
    <nav style="background-color: gray;  text-align: center; border-bottom: 5px solid black;  margin-top: -19px;">
        <a href="Omni-Tools.html"><button class="mybutton">Home</button></a>
        <a href="Color_Picker.html"><button class="mybutton">Color Changer</button></a>
        <a href="Tip_Calculator.html"><button class="mybutton">Tip Calculator</button></a>
        <a href="String_Manager.html"><button class="mybutton">String Manager</button></a>
        <a href="Simple_Quiz.html"><button class="mybutton">Simple Quiz</button></a>
    </nav>

    <main style="display: flex; flex-direction: row; justify-content: center; align-items: center; ">
        <div style=" width: 400px;  border: 5px solid black; border-radius: 10px; margin-top: 30px; overflow: hidden;" class="colorpicker">
            <div style="background-color: rgb(192, 186, 186); padding: 10px; display: flex; flex-direction: row; justify-content: center; align-items: center; border-bottom: 5px solid black; ">
                <h2 style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; text-align: center; margin-top: 10px; margin-bottom: 10px;">String Manipulation</h2>
            </div>

            <br>

            <div>
                <label style="font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif; font-weight: bold; margin-right: 20px; margin-left: 20px;">● <label style="margin-left: 10px;" class="pio">Enter your String</label></label>
                <input type="text" style="border: 4px solid black; border-radius: 10px; padding: 5px;" id="urstring">
                <br><br>
            </div>    

            <hr>
            <br> 

            <div>


                <div style="display: flex; flex-direction: row; justify-content: center;">                
                    <input type="text" readonly style="border: 5px solid black; border-radius: 50px; padding: 10px;" id="wordlength">
                    <button id="copywordlength" style="margin-left: 20px; border-radius: 10px; border: none; outline: none; padding: 20px; font-size: 1rem; font-weight: bold;" class="thebutton">Copy Length</button>
                </div>
                <br>

                <div style="display: flex; flex-direction: row; justify-content: center;">                
                    <input type="text" readonly style="border: 5px solid black; border-radius: 50px; padding: 10px;" id="wordlower">
                    <button id="copywordlower" style="margin-left: 20px; border-radius: 10px; border: none; outline: none; padding: 20px; font-size: 1rem; font-weight: bold;" class="thebutton">Copy Upper-Case Form</button>
                </div>
                <br>

                <div style="display: flex; flex-direction: row; justify-content: center;">                
                    <input type="text" readonly style="border: 5px solid black; border-radius: 50px; padding: 10px;" id="wordupper">
                    <button id="copywordupper" style="margin-left: 20px; border-radius: 10px; border: none; outline: none; padding: 20px; font-size: 1rem; font-weight: bold;" class="thebutton" >Copy Lower-Case Form</button>
                </div>

            </div>       
            
            <br>
            <hr>
            <br>

            <div>


                <div style="display: flex; flex-direction: row; justify-content: center;">                
                    <input type="text"  style="border: 5px solid black; border-radius: 50px; padding: 10px;" id="findingchar">
                    <button id="checkcontaining" style="margin-left: 20px; border-radius: 10px; border: none; outline: none; padding: 20px; font-size: 1rem; font-weight: bold;" class="thebutton">Find</button>
                </div>
                <br>

                <label style="display: flex; flex-direction: row; justify-content: center;">====== <label id="mainlabel_find" style="margin-left: 5px; margin-right: 5px;" class="mylabel">Null</label> ======</label>
                <br>

                <div style="display: flex; flex-direction: row; justify-content: center;">
                    <input type="text" style=" border: 3px solid black; border-radius: 10px; padding: 2px; width: 50px;" id="charone">
                    <label style="margin-left: 15px; margin-right: 15px;">●</label>
                    <input type="text" style=" border: 3px solid black; border-radius: 10px; padding: 2px; width: 50px;" id="chartwo">
                </div>
                <br>

                <div style="display: flex; flex-direction: row; justify-content: center;">
                    <input type="text"   style=" border: 5px solid black; border-radius: 50px; padding: 10px;" id="newsentence">
                    <button id="replaceX" style="margin-left: 20px; border-radius: 10px; border: none; outline: none; padding: 20px; font-size: 1rem; font-weight: bold;" class="thebutton">Replace</button>
                </div>

                <br>

                

            </div> 

        </div>
    </main>
    <br>

    <script>
        const urstring = document.getElementById("urstring");
        const wordlength = document.getElementById("wordlength");
        const copywordlength = document.getElementById("copywordlength");

        const wordlower = document.getElementById("wordlower");
        const wordupper= document.getElementById("wordupper");

        const copywordlower = document.getElementById("copywordlower");
        const copywordupper = document.getElementById("copywordupper");

        const findingchar = document.getElementById("findingchar");
        const checkcontaining = document.getElementById("checkcontaining");
        const displaycharacterexistence = document.getElementById("mainlabel_find");

        const charone = document.getElementById("charone");
        const chartwo = document.getElementById("chartwo");
        const newsentence = document.getElementById("newsentence");
        const replaceX = document.getElementById("replaceX");

        
        urstring.addEventListener("input", function() {
            let temp = urstring.value;
            let len = temp.length;
            let uppered = temp.toUpperCase();
            let lowered = temp.toLowerCase();

            wordlength.value = `${len} Characters`;
            wordlower.value = uppered; 
            wordupper.value = lowered; 
        });

        function addClipboardFeature(buttonelement, sourceinput) {
            buttonelement.addEventListener("click", function() {
                if(sourceinput.value != "") {
                    navigator.clipboard.writeText(sourceinput.value);
                }
            });
        }

        addClipboardFeature(copywordlength, wordlength);
        addClipboardFeature(copywordlower, wordlower);
        addClipboardFeature(copywordupper, wordupper);

        checkcontaining.addEventListener("click", function () {
            let finding = findingchar.value;
            let maintext = urstring.value;

            if (finding != "") {
                if (maintext.includes(finding)) {
                    displaycharacterexistence.textContent = "True";
                } else {
                    displaycharacterexistence.textContent = "False";
                findingchar.value = ""

                };
            };
        });

        replaceX.addEventListener("click", function () {

            let firstchar = charone.value;
            let secondchar = chartwo.value;
            let original = urstring.value;

            if(original.includes(firstchar) && original.includes(secondchar)) {
                let updated = original.split(firstchar).join(secondchar);
                newsentence.value = updated;
                
            }    
        })


    </script>
</body>
</html>
